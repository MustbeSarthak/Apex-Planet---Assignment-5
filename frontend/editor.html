<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor - Apex Journal</title><link rel="stylesheet" href="/css/style.css">
  <script src="/js/api.js" defer></script><script src="/js/auth.js" defer></script><script src="/js/posts.js" defer></script><script src="/js/app.js" defer></script>
</head>
<body data-page="editor">
  <header class="site-header"><nav class="nav container" aria-label="Main navigation"><a class="brand" href="/index.html">Apex<span>Journal</span></a><div class="nav-actions"><button class="theme-button" type="button" data-theme-toggle aria-label="Toggle theme">◐</button><div data-auth-nav></div></div></nav></header>
  <main class="container narrow">
    <h1 data-editor-title>New post</h1>
    <p class="form-message" data-editor-status hidden></p>
    <form id="post-form" class="form">
      <label for="title">Title</label><input id="title" name="title" required maxlength="160">
      <label for="category">Category</label><input id="category" name="category" required maxlength="50">
      <label for="coverImage">Cover image URL</label><input id="coverImage" name="coverImage" type="url" placeholder="https://...">
      <label for="content">Content</label><textarea id="content" name="content" rows="14" required></textarea>
      <button class="button" type="submit" data-label="Publish post">Publish post</button>
    </form>
  </main>
  <footer class="footer"><div class="container">Apex Journal</div></footer>
</body>
</html>
