<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - Apex Journal</title><link rel="stylesheet" href="/css/style.css">
  <script src="/js/api.js" defer></script><script src="/js/auth.js" defer></script><script src="/js/posts.js" defer></script><script src="/js/app.js" defer></script>
</head>
<body data-page="register">
  <header class="site-header"><nav class="nav container" aria-label="Main navigation"><a class="brand" href="/index.html">blog<span>App</span></a><div class="nav-actions"><button class="theme-button" type="button" data-theme-toggle aria-label="Toggle theme">◐</button><div data-auth-nav></div></div></nav></header>
  <main class="container auth-layout">
    <form id="auth-form" class="form auth-card">
      <h1>Create account</h1>
      <p class="form-message" data-auth-status hidden></p>
      <label for="name">Name</label><input id="name" name="name" autocomplete="name" required minlength="2" maxlength="60">
      <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <button class="button" type="submit" data-label="Create account">Create account</button>
      <p class="muted">Already have an account? <a href="/login.html">Log in</a></p>
    </form>
  </main>
</body>
</html>
